version: "3.9"

services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env.prod.be
    volumes:
      - ./staticfiles:/app/staticfiles  # Django static files
    ports:
      - "8000:8000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        ENV_FILE: .env.prod.fe
    image: nms-frontend
    container_name: frontend
    depends_on:
      - backend

  nginx:
    image: nms-frontend   # Uses the frontend image with React + nginx
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./staticfiles:/app/staticfiles  # <-- this exposes Django static to Nginx

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
