version: "3.9"

services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env.prod.be
    volumes:
      - ./staticfiles:/app/staticfiles
    depends_on:
      - redis
    # optional port mapping if needed externally
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        ENV_FILE: .env.prod.fe
    image: nms-frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "80:80"   # React + Nginx

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
