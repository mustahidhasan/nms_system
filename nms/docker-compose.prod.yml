version: "3.9"

services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env.prod.be
    volumes:
      - ./staticfiles:/app/staticfiles  # Django static files
    ports:
      - "8000:8000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        ENV_FILE: .env.prod.fe
    image: nms-frontend
    container_name: frontend
    depends_on:
      - backend

  nginx:
    image: nms-frontend         # keep using frontend image
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./frontend/build:/usr/share/nginx/html         # React build
      - ./nginx.conf:/etc/nginx/conf.d/default.conf    # Nginx config
      - ./certs:/etc/ssl/private                       # Self-signed SSL certs
      - ./staticfiles:/app/staticfiles                 # Django static files
    restart: always

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
