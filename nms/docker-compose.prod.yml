version: "3.9"

services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env.prod.be
    volumes:
      - ./staticfiles:/app/staticfiles  # Django static files
    ports:
      - "8000:8000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        ENV_FILE: .env.prod.fe
    image: nms-frontend
    container_name: frontend
    depends_on:
      - backend

  nginx:
    image: nms-frontend  # ✅ Use same frontend image with nginx
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      # ✅ Mount React build
      - ./frontend/build:/usr/share/nginx/html
      # ✅ Mount correct Nginx config file
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      # ✅ Mount SSL certs (self-signed)
      - ./certs:/etc/ssl/private
      # ✅ Mount Django static files
      - ./staticfiles:/app/staticfiles
    restart: always

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
