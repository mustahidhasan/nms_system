name = "nms-backend-worker"
main = "src/index.js"
compatibility_date = "2026-04-06"
workers_dev = true
account_id = "819afce68059fabdf7fcea000e2d162c"

[observability]
enabled = true

[vars]
FRONTEND_URL = "http://127.0.0.1:8788"
POST_LOGOUT_REDIRECT_URI = "http://127.0.0.1:8788/"
CORS_ALLOWED_ORIGINS = "http://127.0.0.1:8788"
AZURE_SCOPES = "openid profile email offline_access User.Read"
DEFAULT_FROM_EMAIL = "no-reply@example.com"
COOKIE_SECURE = "false"
AUTH_PASSWORD_SALT = "replace-with-secure-random-salt"
DEFAULT_LOCAL_ADMIN_EMAIL = "admin@gmail.com"
DEFAULT_LOCAL_ADMIN_PASSWORD = "admin@gmail.com"
DIAGNOSTICS_EXECUTOR_URL = "http://127.0.0.1:8000"
DIAGNOSTICS_EXECUTOR_TOKEN = "replace-with-shared-executor-token"

[[d1_databases]]
binding = "NMS_DB"
database_name = "nms-db"
database_id = "7ce85d17-f418-42cc-9f3a-168aba0935ee"
preview_database_id = "REPLACE_WITH_PREVIEW_D1_DATABASE_ID"

[env.dev]
name = "nms-backend-worker-dev"

[env.dev.vars]
FRONTEND_URL = "http://127.0.0.1:8788"
POST_LOGOUT_REDIRECT_URI = "http://127.0.0.1:8788/"
CORS_ALLOWED_ORIGINS = "http://127.0.0.1:8788"
AZURE_SCOPES = "openid profile email offline_access User.Read"
DEFAULT_FROM_EMAIL = "no-reply@example.com"
COOKIE_SECURE = "false"
AUTH_PASSWORD_SALT = "replace-with-secure-random-salt"
DEFAULT_LOCAL_ADMIN_EMAIL = "admin@gmail.com"
DEFAULT_LOCAL_ADMIN_PASSWORD = "admin@gmail.com"
DIAGNOSTICS_EXECUTOR_URL = "http://127.0.0.1:8000"
DIAGNOSTICS_EXECUTOR_TOKEN = "replace-with-shared-executor-token"

[[env.dev.d1_databases]]
binding = "NMS_DB"
database_name = "nms-db-dev"
database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"
preview_database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"

[env.prod]
name = "nms-backend-worker-prod"
routes = [
  { pattern = "backend.example.com/*", zone_name = "example.com" }
]

[env.prod.vars]
COOKIE_SECURE = "true"
FRONTEND_URL = "https://frontend.example.com"
POST_LOGOUT_REDIRECT_URI = "https://frontend.example.com/"
CORS_ALLOWED_ORIGINS = "https://frontend.example.com"
AZURE_SCOPES = "openid profile email offline_access User.Read"
DEFAULT_FROM_EMAIL = "no-reply@example.com"
AUTH_PASSWORD_SALT = "replace-with-secure-random-salt"
DEFAULT_LOCAL_ADMIN_EMAIL = "admin@gmail.com"
DEFAULT_LOCAL_ADMIN_PASSWORD = "admin@gmail.com"
DIAGNOSTICS_EXECUTOR_URL = "https://diagnostics.example.com"
DIAGNOSTICS_EXECUTOR_TOKEN = "replace-with-prod-shared-executor-token"

[[env.prod.d1_databases]]
binding = "NMS_DB"
database_name = "nms-db"
database_id = "7ce85d17-f418-42cc-9f3a-168aba0935ee"
preview_database_id = "REPLACE_WITH_PREVIEW_D1_DATABASE_ID"
