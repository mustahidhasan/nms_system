version: '3.9'

services:
  backend:
    build:
      context: ./  # nms/ folder
      dockerfile: Dockerfile
    container_name: django
    volumes:
      - ./:/app
      - ./db.sqlite3:/app/db.sqlite3
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react
    ports:
      - "80:80"  # Serve React on default HTTP port
    depends_on:
      - backend

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
