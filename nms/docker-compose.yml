services:
  backend:
    build:
      context: ./  # nms/ folder
      dockerfile: Dockerfile
    container_name: django
    volumes:
      - ./:/app   # Mount entire backend for live editing
      - ./db.sqlite3:/app/db.sqlite3  # Persist SQLite
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react
    ports:
      - "3000:80"
    depends_on:
      - backend

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
