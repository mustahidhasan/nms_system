{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Operations</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'css/user.css' %}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.0/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
            }
        
            .navbar {
                width: 100%;
                background-color: #3c3855;
            }
        
            .container-fluid {
                display: flex;
                justify-content: space-between;
                /* Ensures left, center, and right sections are properly spaced */
                align-items: center;
                padding: 0;
                margin: 0;
            }
        
            .navbar-nav {
                display: flex;
                gap: 15px;
                /* Space between nav items */
            }
        
            .navbar-brand img {
                width: 80px;
                height: 60px;
                border-radius: 10px;
            }
        
            .collapse {
                flex-grow: 1;
                display: flex;
                justify-content: center;
                /* Center-align nav items */
            }
        
            .navbar-brand:last-child {
                margin-left: auto;
                /* Push the right logo to the far right */
            }
        
            .active {
                font-weight: bolder;
            }
        
            /* Hover effect for nav links */
            .nav-link {
                color: #ffffff; /* Default color */
                text-decoration: none; /* No underline */
                transition: color 0.3s ease, background-color 0.3s ease; /* Smooth transition */
                padding: 5px 10px; /* Padding for better hover visibility */
                border-radius: 5px; /* Rounded corners on hover */
            }
        
            .nav-link:hover {
                color: #000000; /* Text color on hover */
                background-color: #c5aeeb; /* Background color on hover */
                text-decoration: none; /* Ensure no underline on hover */
            }
        </style>
        
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <!-- Left Logo -->
            <a class="navbar-brand" href="{% url 'ping_operation' %}">
                <img style="width: 80px; height: 60px; border-radius: 10px;" src="{% static 'images/logo_left.png' %}"
                    alt="logo">
            </a>

            <!-- Center Navigation Items -->
            <div class="collapse navbar-collapse justify-content-center" id="navbarTogglerDemo01">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="{% url 'ping_operation' %}">Home</a>
                    </li>
                    <li class="nav-item" id="refresh-item">
                        <a class="nav-link" href="#">Refresh</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">Log out</a>
                    </li>
                </ul>
            </div>

            <!-- Right Logo -->
            <a class="navbar-brand" href="{% url 'ping_operation' %}">
                <img style="width: 80px; height: 60px; border-radius: 10px; border: 1px solid rgb(2, 0, 0);"
                    src="{% static 'images/nms_logo.png' %}" alt="logo">
            </a>
        </div>
    </nav>


    <br>
    <div class="container col-12">
        <div class="row justify-content-center">
          <!-- Network Operations Form -->
          <div class="col-md-8">
            <div class="card shadow-lg">
              <div class="card-body">
                <h3 class="card-title text-center mb-4">Network Operations</h3>
                <form method="POST" action="{% url 'ping_operation' %}">
                  {% csrf_token %}
      
                  <!-- Input for IP/Hostname -->
                  <div class="form-group">
                    <label for="ipAddress" class="form-label">Enter IP Address or Domain Name</label>
                    <input type="text" class="form-control" id="ipAddress" name="ip_address" placeholder="Enter IP address or domain name">
                  </div>
      
                  <!-- SNMP Fields -->
                  <div id="snmp_fields" class="p-3 border rounded bg-light" style="display: none;">
                    <h5 class="mb-3">SNMP Configuration</h5>
      
                    <label for="snmp_version" class="form-label">SNMP Version:</label>
                    <select class="form-control mb-3" name="snmp_version" id="snmp_version" onchange="toggleSNMPVersionFields()">
                      <option value="">Select a version</option>
                      <option value="2c">SNMPv2c</option>
                      <option value="3">SNMPv3</option>
                    </select>
      
                    <!-- SNMPv2c Fields -->
                    <div id="v2c" style="display: none;">
                      <label for="read_community_string" class="form-label">Read Community String:</label>
                      <input type="text" class="form-control mb-3" name="read_community_string" id="read_community_string">
                    </div>
      
                    <!-- SNMPv3 Fields -->
                    <div id="v3" style="display: none;">
                      <label for="username" class="form-label">Username:</label>
                      <input type="text" class="form-control mb-3" name="username" id="username">
      
                      <label for="password" class="form-label">Password:</label>
                      <input type="password" class="form-control mb-3" name="password" id="password">
      
                      <label for="authentication_type" class="form-label">Authentication Type:</label>
                      <select class="form-control mb-3" name="authentication_type" id="authentication_type">
                        <option value="None">None</option>
                        <option value="MD5">MD5</option>
                        <option value="SHA">SHA</option>
                      </select>
      
                      <label for="encryption_type" class="form-label">Encryption Type:</label>
                      <select class="form-control mb-3" name="encryption_type" id="encryption_type">
                        <option value="None">None</option>
                        <option value="AES">AES</option>
                        <option value="DES">DES</option>
                      </select>
      
                      <label for="encryption_key" class="form-label">Encryption Key:</label>
                      <input type="text" class="form-control mb-3" name="encryption_key" id="encryption_key">
      
                      <label for="snmp_command" class="form-label">SNMP Command:</label>
                      <select class="form-control mb-3" name="snmp_command" id="snmp_command">
                        <option value="snmpwalk">SNMP Walk</option>
                        <option value="snmpget">SNMP Get</option>
                      </select>
      
                      <label for="oid" class="form-label">Numeric OID:</label>
                      <input type="text" class="form-control mb-3" name="oid" id="oid" value="1.3.6.1.2.1.1.5">
      
                      <label for="output_format" class="form-label">Output Format:</label>
                      <select class="form-control mb-3" name="output_format" id="output_format">
                        <option value="default">Default</option>
                        <option value="numeric">Numeric OIDs</option>
                        <option value="certification">Certification Walk</option>
                        <option value="hex">Hex String</option>
                      </select>
                    </div>
                  </div>
      
                  <!-- Checkboxes for Operations -->
                <div class="form-group">
                    <label class="form-label">Select Operations</label>
                    <div class="row">
                    <!-- First Row of Checkboxes -->
                    <div class="col-md-3">
                        <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="enable_ping" name="enable_ping" value="1">
                        <label class="form-check-label" for="enable_ping">Enable Ping</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="verbose_ping" name="verbose_ping" value="1">
                        <label class="form-check-label" for="verbose_ping">Verbose Ping</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="traceroute" name="traceroute" value="1">
                        <label class="form-check-label" for="traceroute">Traceroute</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="dns_lookup" name="dns_lookup" value="1">
                        <label class="form-check-label" for="dns_lookup">DNS Lookup</label>
                        </div>
                    </div>
                    </div>
                    <div class="row mt-3">
                    <!-- Second Row for SNMP Walk -->
                    <div class="col-md-12">
                        <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="snmp_walk" name="snmp_walk" value="1" onclick="toggleSNMPFields()">
                        <label class="form-check-label" for="snmp_walk">SNMP Walk</label>
                        </div>
                    </div>
                    </div>
                </div>
  
      
                  <button class="btn btn-primary w-100 mt-4" type="submit">Run Network Operations</button>
                </form>
              </div>
            </div>
          </div>
      
          <!-- Network Results -->
          <div class="col-md-12 mt-4">
            <div class="card shadow-lg">
              <div class="card-body">
                {% if table %}
                <h3 class="card-title">Results</h3>
                <table class="table table-bordered table-striped mt-3">
                  <thead>
                    <tr>
                      <th>Operation</th>
                      <th>Result</th>
                    </tr>
                  </thead>
                  <tbody>
                    {% for row in table.rows %}
                    <tr>
                      <td>{{ row.0 }}</td>
                      <td>
                        <div style="max-height: 200px; overflow-y: auto;">
                          <pre>{{ row.1 }}</pre>
                        </div>
                      </td>
                    </tr>
                    {% endfor %}
                  </tbody>
                </table>
                {% endif %}
              </div>
            </div>
          </div>
        </div>
      </div>
      

    <script>
        function toggleSNMPFields() {
            const snmpFields = document.getElementById('snmp_fields');
            const snmpCheckbox = document.getElementById('snmp_walk');
            if (snmpCheckbox.checked) {
                snmpFields.style.display = 'block';
            } else {
                snmpFields.style.display = 'none';
            }
        }

        // Add a refresh button
        document.getElementById("refresh-item").addEventListener("click", function () {
            location.reload();
        });
        // Function to toggle SNMP version-specific fields
        function toggleSNMPVersionFields() {
            var snmpVersion = document.getElementById("snmp_version").value;
            var v2cDiv = document.getElementById("v2c");
            var v3Div = document.getElementById("v3");

            // Show the v2c fields if SNMPv2c is selected, otherwise hide it
            if (snmpVersion === "2c") {
                v2cDiv.style.display = "block"; // Show SNMPv2c fields
            } else {
                v2cDiv.style.display = "none";  // Hide SNMPv2c fields
            }

            if (snmpVersion === "3") {
                v2cDiv.style.display = "block";
                v3Div.style.display = "block"; // Show SNMPv2c fields
            } else {
                v3Div.style.display = "none";  // Hide SNMPv2c fields
            }

        }

        // Ensure the correct fields are visible on page load
        window.onload = function () {
            toggleSNMPVersionFields();
        };
    </script>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
