{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="{% static 'css/user.css' %}" />
    
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <!-- Left Logo -->
        <a class="navbar-brand" href="{% url 'ping_operation' %}">
          <img src="{% static 'images/logo_left.png' %}" alt="logo" />
        </a>
        <h2 style="text-align: center; margin: 10px; color: #247e00; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 28px; font-weight: 600; letter-spacing: 1.5px; text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);">Network Operations</h2>

        <!-- Right Logo -->
        <a class="navbar-brand" href="{% url 'ping_operation' %}">
          <img src="{% static 'images/nms_logo.png' %}" alt="logo" />
        </a>
      </div>
    </nav>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          
          <div class="card">
            <div class="card-body">
              <h1 class="card-title text-center">Login</h1>

              <form method="POST">
                {% csrf_token %}

                <!-- Username Field -->
                <div class="mb-3 mt-2">
                  <input
                    type="text"
                    class="form-control mt-5"
                    id="username"
                    name="username"
                    placeholder="Enter your Email"
                    required
                  />
                </div>

                <!-- Password Field -->
                <div class="mb-3 mt-4">
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                  />
                </div>

                <!-- Show Password Checkbox -->
                <div class="show-password mb-3 mt-5">
                  <input
                    type="checkbox"
                    class="show-password-input"
                    id="showPassword"
                    onclick="togglePassword()"
                  />
                  <label class="show-password-label" for="showPassword"
                    >Show Password</label
                  >
                </div>

              <!-- Three Buttons in One Line -->
              <div class="d-flex justify-content-between mt-4">
                <!-- Sign Up Button -->
                <a href="{% url 'register' %}" class="btn btn-primary btn-custom mt-3" style="pointer-events: none; opacity: 0.6;">
                  <strike>Sign Up</strike>
                </a>
                <!-- Forgot Password Button -->
                <a href="{% url 'password_reset' %}" class="btn-custom mt-3" style="pointer-events: none; opacity: 0.6;">
                  <strike>Forgot Password</strike>
                </a>
                <!-- Login Button -->
                <button type="submit" class="btn btn-success btn-custom" >
                  Login
                </button>
              </div>


              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/user.js' %}"></script>
  </body>
</html>
