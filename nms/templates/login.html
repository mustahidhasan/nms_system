{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="{% static 'css/user.css' %}" />

    <style>
      /* Navbar styles */
      .dropdown-menu {
        position: absolute;
        top: 100%;
        right: 0;
        background-color: white;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        display: none;
        min-width: 120px;
        z-index: 1000;
      }
      .dropdown-menu a {
        display: block;
        padding: 10px;
        text-decoration: none;
        color: black;
      }
      .dropdown-menu a:hover {
        background-color: #f1f1f1;
      }
      .show {
        display: block;
      }

      /* Popup Modal Styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 1050;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
      }
      .modal-content {
        background-color: white;
        margin: 10% auto;
        padding: 20px;
        border-radius: 5px;
        width: 80%;
        max-width: 600px;
        text-align: center;
        position: relative;
      }
      .modal-content h4 {
        margin-bottom: 15px;
      }
      .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 24px;
        cursor: pointer;
      }
      .pdf-container {
        width: 100%;
        height: 500px;
        border: none;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <!-- Left Logo -->
        <a class="navbar-brand" href="{% url 'ping_operation' %}">
          <img src="{% static 'images/logo_left.png' %}" alt="logo" />
        </a>

        <!-- Center Title -->
        <h2
          class="navbar-title"
          style="
            text-align: center;
            margin: 0;
            color: #247e00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
            flex-grow: 1; /* Allows the title to take remaining space */
          "
        >
          Network Operations
        </h2>

        <!-- Right Logo -->
        <a class="navbar-brand" href="{% url 'ping_operation' %}">
          <img src="{% static 'images/nms_logo.png' %}" alt="logo" />
        </a>

        <!-- Settings Dropdown -->
        <div class="navbar-icon-container">
          <a class="navbar-icon" href="javascript:void(0)" onclick="toggleDropdown()">
            <img src="{% static 'images/icons8-settings-50.png' %}" alt="setting" />
          </a>
          <div id="dropdown" class="dropdown-menu">
            <a href="javascript:void(0)" onclick="showPopup()">
              <img src="{% static 'images/icons8-about-50.png' %}" alt="about" /> About
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Popup Modal -->
    <div id="popup" class="modal">
      <div class="modal-content">
        <span class="close-btn" onclick="closePopup()">&times;</span>
        <h4>Project Setup Steps</h4>
        <embed
          src="{% static 'files/nms_pdf.pdf' %}"
          type="application/pdf"
          class="pdf-container"
        />
      </div>
    </div>

    <!-- Login Form -->
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-body">
              <h1 class="card-title text-center">Login</h1>

              <form method="POST">
                {% csrf_token %}

                <!-- Username Field -->
                <div class="mb-3 mt-2">
                  <input
                    type="text"
                    class="form-control mt-5"
                    id="username"
                    name="username"
                    placeholder="Enter your Email"
                    required
                  />
                </div>

                <!-- Password Field -->
                <div class="mb-3 mt-4">
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                  />
                </div>

                <!-- Show Password Checkbox -->
                <div class="show-password mb-3 mt-5">
                  <input
                    type="checkbox"
                    class="show-password-input"
                    id="showPassword"
                    onclick="togglePassword()"
                  />
                  <label class="show-password-label" for="showPassword">Show Password</label>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between mt-4">
                  <a href="{% url 'register' %}" class="btn btn-primary btn-custom mt-3" style="pointer-events: none; opacity: 0.6;">
                    <strike>Sign Up</strike>
                  </a>
                  <a href="{% url 'password_reset' %}" class="btn-custom mt-3" style="pointer-events: none; opacity: 0.6;">
                    <strike>Forgot Password</strike>
                  </a>
                  <button type="submit" class="btn btn-success btn-custom">
                    Login
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script>
      function toggleDropdown() {
        var dropdown = document.getElementById("dropdown");
        dropdown.classList.toggle("show");
      }

      function showPopup() {
        var popup = document.getElementById("popup");
        popup.style.display = "block";
      }

      function closePopup() {
        var popup = document.getElementById("popup");
        popup.style.display = "none";
      }

      function togglePassword() {
        var passwordField = document.getElementById("password");
        passwordField.type = passwordField.type === "password" ? "text" : "password";
      }

      // Close dropdown when clicking outside
      document.addEventListener("click", function (event) {
        var dropdown = document.getElementById("dropdown");
        var icon = document.querySelector(".navbar-icon");
        if (!dropdown.contains(event.target) && !icon.contains(event.target)) {
          dropdown.classList.remove("show");
        }
      });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
