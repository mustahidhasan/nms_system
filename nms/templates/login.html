
{% load static %}

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Operations</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/2.3.0/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous" />
  <link rel="stylesheet" type="text/css" href="{% static 'css/ping.css' %}" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <!-- Left Logo -->
      <a class="navbar-brand" href="{% url 'ping_operation' %}">
        <img src="{% static 'images/logo_left.png' %}" alt="logo" />
      </a>

      <!-- Center Navigation Items -->
      <div class="collapse navbar-collapse justify-content-center" id="navbarTogglerDemo01">
        <!-- <ul class="navbar-nav">
            <li class="nav-item active">
              <a class="nav-link" href="{% url 'ping_operation' %}">Home</a>
            </li>
            <li class="nav-item" id="refresh-item">
              <a class="nav-link" href="">Refresh</a>
            </li>
          </ul> -->
          <h2 style="text-align: center; margin: 10px; color: #247e00; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 28px; font-weight: 600; letter-spacing: 1.5px; text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);">Network Operations</h2>
      </div>

      <!-- Right Logo -->

      <a class="navbar-brand" href="{% url 'ping_operation' %}">
        <img src="{% static 'images/nms_logo.png' %}" alt="logo" />
      </a>

      <div class="navbar-icon-container">
        <a class="navbar-icon" href="javascript:void(0)" onclick="toggleDropdown()">
          <img src="{% static 'images/icons8-settings-50.png' %}" alt="setting" />
        </a>
        <div id="dropdown" class="dropdown-menu">
          {% if user.is_superuser %}
          <a class="navbar-icon" href="#">
            <img src="{% static 'images/icons8-user-48.png' %}" alt="users" />Users
          </a>
          {% endif %}
          <!-- About with Popup Trigger -->
          <a class="navbar-icon" href="javascript:void(0)" onclick="showPopup()">
            <img src="{% static 'images/icons8-about-50.png' %}" alt="about" />About
          </a>

       
        </div>
      </div>

      <!-- Popup Modal -->
      <div
      id="popup"
      class="popup-overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        visibility: hidden;
        opacity: 0;
        transition: visibility 0.3s, opacity 0.3s;
      "
      >
      <div
        class="popup-content"
        style="
          background-color: #fff;
          padding: 20px;
          border-radius: 10px;
          box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
          width: 80%;
          max-width: 700px;
          max-height: 90vh;
          overflow: auto;
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
        "
      >
        <!-- Close Button -->
        <span
          class="close-btn"
          onclick="closePopup()"
          style="
            font-size: 24px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            position: absolute;
            top: 15px;
            right: 15px;
          "
        >
          &times;
        </span>
        <!-- PDF Viewer -->
        <br />
        <h4>Project set up Steps</h4><br />
        <embed
          src="{% static 'files/nms_pdf.pdf' %}"
          type="application/pdf"
          style="width: 100%; height: 500px; border: none;"
        />
      </div>
      </div>


    </div>
  </nav>

  <div class="container col-12 mt-1">
    <h1>Welcome to the Login Page</h1>
    <p>Click the button below to login via Microsoft Azure SSO:</p>
    <form method="get" action="{% url 'azure_login' %}">
        <button type="submit">Login via SSO</button>
    </form>
  </div>



  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/ping.js' %}"></script>
  <script>
    function showPopup() {
      var popup = document.getElementById("popup");
      popup.style.visibility = "visible";
      popup.style.opacity = "1";
    }
    
    function closePopup() {
      var popup = document.getElementById("popup");
      popup.style.visibility = "hidden";
      popup.style.opacity = "0";
    }
  </script>
    

</body>

</html>
