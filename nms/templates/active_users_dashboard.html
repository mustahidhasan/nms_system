<div class="container mt-5">
    <div class="text-center">
      <h1 class="mb-4">Active Users Dashboard</h1>
      <p class="lead">Current Active Users: <strong>{{ active_user_count }}</strong></p>
      <a href="{% url 'ping_operation' %}" class="btn btn-primary">Back To Home</a>
      <button onclick="location.reload();" class="btn btn-secondary">Refresh</button>
    </div>
  
    <h2 class="mt-5 mb-3 text-center">Active Users Details</h2>
  
    <div class="row">
      {% for user in active_users %}
        <div class="col-md-4">
          <div class="card mb-4 shadow-sm">
            <div class="card-body text-center">
              <h5 class="card-title">{{ user.first_name }} {{ user.last_name }}</h5>
              <p class="card-text"><strong>Email:</strong> {{ user.email }}</p>
              <p class="badge {% if user.is_active %} bg-success {% else %} bg-danger {% endif %}">
                {{ user.is_active|yesno:"Active,Inactive" }}
              </p>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
</div>

<!-- Bootstrap Styles (Include in layout) -->
<link rel="stylesheet" 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
