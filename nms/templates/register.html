{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="{% static 'css/user.css' %}" />

    <style>
      .invalid {
        color: red;
      }
      .valid {
        color: green;
      }
      .password-message {
        display: none;
        margin-top: 10px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <!-- Left Logo -->
        <a class="navbar-brand" href="{% url 'ping_operation' %}">
          <img src="{% static 'images/logo_left.png' %}" alt="logo" />
        </a>
        <!-- Right Logo -->
        <a class="navbar-brand" href="{% url 'ping_operation' %}">
          <img src="{% static 'images/nms_logo.png' %}" alt="logo" />
        </a>
      </div>
    </nav>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="card-body">
              <h1 class="card-title text-center">Register</h1>
              <form id="register-form" method="post">
                {% csrf_token %}

                <!-- First Name and Last Name in the same row -->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <input
                      type="text"
                      name="first_name"
                      id="first_name"
                      class="form-control mt-5"
                      placeholder="Enter your First Name"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <input
                      type="text"
                      name="last_name"
                      id="last_name"
                      class="form-control mt-5"
                      placeholder="Enter your Last Name"
                      required
                    />
                  </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <input
                    type="email"
                    name="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your Email"
                    required
                  />
                </div>

                <!-- Password and Confirm Password in the same row -->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <input
                      type="password1"
                      name="password1"
                      id="password1"
                      class="form-control"
                      placeholder="Enter your Password"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <input
                      type="password2"
                      name="password2"
                      id="password2"
                      class="form-control"
                      placeholder="Confirm Password"
                      required
                    />
                  </div>
                </div>

                <div id="password-message" class="password-message">
                  <p>Password must contain:</p>
                  <ul class="list-unstyled">
                    <li id="length" class="invalid">At least 8 characters</li>
                    <li id="uppercase" class="invalid">
                      At least one uppercase letter
                    </li>
                    <li id="number" class="invalid">At least one number</li>
                  </ul>
                </div>

                <!-- Three Buttons in One Line -->
                <div class="d-flex justify-content-between mt-4">
                  <!-- Login Button -->
                  <a href="{% url 'login' %}" class="btn btn-primary btn-custom mt-3">
                    Login
                  </a>
                  <!-- Forgot Password Button -->
                  <a href="#" class="btn btn-custom mt-3">
                    Forgot Password
                  </a>
                  <!-- Sign Up Button -->
                  <button type="submit" class="btn btn-success btn-custom">
                    Sign Up
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const passwordInput = document.querySelector('input[name="password"]');
      const confirmPasswordInput = document.querySelector(
        'input[name="password"]'
      );
      const passwordMessage = document.getElementById("password-message");
      const lengthCheck = document.getElementById("length");
      const uppercaseCheck = document.getElementById("uppercase");
      const numberCheck = document.getElementById("number");
      const registerForm = document.getElementById("register-form");

      passwordInput.addEventListener("input", function () {
        const password = passwordInput.value;

        if (password.length >= 8) {
          lengthCheck.classList.remove("invalid");
          lengthCheck.classList.add("valid");
        } else {
          lengthCheck.classList.remove("valid");
          lengthCheck.classList.add("invalid");
        }

        if (/[A-Z]/.test(password)) {
          uppercaseCheck.classList.remove("invalid");
          uppercaseCheck.classList.add("valid");
        } else {
          uppercaseCheck.classList.remove("valid");
          uppercaseCheck.classList.add("invalid");
        }

        if (/\d/.test(password)) {
          numberCheck.classList.remove("invalid");
          numberCheck.classList.add("valid");
        } else {
          numberCheck.classList.remove("valid");
          numberCheck.classList.add("invalid");
        }

        passwordMessage.style.display = "block";
      });

      registerForm.addEventListener("submit", function (event) {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        const isLengthValid = password.length >= 8;
        const isUppercaseValid = /[A-Z]/.test(password);
        const isNumberValid = /\d/.test(password);
        const isPasswordMatch = password === confirmPassword;

        if (
          !isLengthValid ||
          !isUppercaseValid ||
          !isNumberValid ||
          !isPasswordMatch
        ) {
          event.preventDefault();
          alert(
            "User did not register. Please fill the form carefully and ensure passwords match."
          );
        } else {
          alert("Registration successful! Welcome!");
        }
      });
    </script>
  </body>
</html>
