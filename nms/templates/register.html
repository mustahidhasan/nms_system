{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="{% static 'css/user.css' %}" />

    <style>
      .invalid {
        color: red;
      }
      .valid {
        color: green;
      }
      .password-message {
        display: none;
        margin-top: 10px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div
        class="container-fluid d-flex justify-content-between align-items-center"
      >
        <!-- Left Logo -->
        <a class="navbar-brand" href="{% url 'ping_operation' %}">
          <img src="{% static 'images/logo_left.png' %}" alt="logo" />
        </a>
        <!-- Right Logo -->
        <a class="navbar-brand" href="{% url 'ping_operation' %}">
          <img src="{% static 'images/nms_logo.png' %}" alt="logo" />
        </a>
      </div>
    </nav>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          {% if messages %}
            <div class="container mt-4">
              {% for message in messages %}
                <div
                  class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} alert-dismissible fade show"
                  role="alert"
                  id="message-{{ forloop.counter }}">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              {% endfor %}
            </div>
            <script>
              setTimeout(function() {
                var messages = document.querySelectorAll('.alert');
                messages.forEach(function(message) {
                  message.classList.remove('show');
                  message.classList.add('fade');
                });
              }, 10000); // 10000 milliseconds = 10 seconds
            </script>
          {% endif %}
          <div class="card">
            <div class="card-body">
              <h1 class="card-title text-center">Register</h1>
              <form id="register-form" method="post">
                {% csrf_token %}

                <!-- First Name and Last Name -->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <input
                      type="text"
                      name="first_name"
                      id="first_name"
                      class="form-control mt-5"
                      placeholder="Enter your First Name"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <input
                      type="text"
                      name="last_name"
                      id="last_name"
                      class="form-control mt-5"
                      placeholder="Enter your Last Name"
                      required
                    />
                  </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <input
                    type="email"
                    name="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter your Email"
                    required
                  />
                </div>

                <!-- Password and Confirm Password -->
                <div class="row mb-3">
                  <div class="col-md-6">
                    <input
                      type="password"
                      name="password1"
                      id="password1"
                      class="form-control"
                      placeholder="Enter your Password"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <input
                      type="password"
                      name="password2"
                      id="password2"
                      class="form-control"
                      placeholder="Confirm Password"
                      required
                    />
                    <div id="confirm-password-feedback" class="password-message">
                      Passwords do not match.
                    </div>
                  </div>
                </div>

                <!-- Password Requirements -->
                <div id="password-message" class="password-message">
                  <p>Password must contain:</p>
                  <ul class="list-unstyled">
                    <li id="length" class="invalid">At least 8 characters</li>
                    <li id="uppercase" class="invalid">
                      At least one uppercase letter
                    </li>
                    <li id="number" class="invalid">At least one number</li>
                  </ul>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between mt-4">
                  <a href="{% url 'login' %}" class="btn btn-primary btn-custom mt-3">
                    Login
                  </a>
                  <a href="{% url 'password_reset' %}" class="btn-custom mt-3">
                    Forgot Password
                  </a>
                  <button type="submit" class="btn btn-success btn-custom">
                    Sign Up
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const passwordInput = document.getElementById("password1");
      const confirmPasswordInput = document.getElementById("password2");
      const passwordMessage = document.getElementById("password-message");
      const lengthCheck = document.getElementById("length");
      const uppercaseCheck = document.getElementById("uppercase");
      const numberCheck = document.getElementById("number");
      const confirmPasswordFeedback = document.getElementById(
        "confirm-password-feedback"
      );

      passwordInput.addEventListener("input", function () {
        const password = passwordInput.value;

        // Length check
        if (password.length >= 8) {
          lengthCheck.classList.add("valid");
          lengthCheck.classList.remove("invalid");
        } else {
          lengthCheck.classList.add("invalid");
          lengthCheck.classList.remove("valid");
        }

        // Uppercase check
        if (/[A-Z]/.test(password)) {
          uppercaseCheck.classList.add("valid");
          uppercaseCheck.classList.remove("invalid");
        } else {
          uppercaseCheck.classList.add("invalid");
          uppercaseCheck.classList.remove("valid");
        }

        // Number check
        if (/\d/.test(password)) {
          numberCheck.classList.add("valid");
          numberCheck.classList.remove("invalid");
        } else {
          numberCheck.classList.add("invalid");
          numberCheck.classList.remove("valid");
        }

        passwordMessage.style.display = "block";
      });

      confirmPasswordInput.addEventListener("input", function () {
        if (confirmPasswordInput.value === passwordInput.value) {
          confirmPasswordFeedback.style.display = "none";
        } else {
          confirmPasswordFeedback.style.display = "block";
        }
      });

      document.getElementById("register-form").addEventListener("submit", (e) => {
        if (
          lengthCheck.classList.contains("invalid") ||
          uppercaseCheck.classList.contains("invalid") ||
          numberCheck.classList.contains("invalid") ||
          confirmPasswordInput.value !== passwordInput.value
        ) {
          e.preventDefault();
          alert("Please ensure all fields are valid.");
        }
      });
    </script>
  </body>
</html>
