version: "3.9"

services:
  backend:
    build:
      context: ./ 
      dockerfile: Dockerfile
      args:
        HOST_IP: localhost
    env_file:
      - .env.dev
    volumes:
      - ./:/app
      - ./staticfiles:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        ENV_FILE: .env.dev
    container_name: react
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
