services:
  backend:
    build:
      context: ./ 
      dockerfile: Dockerfile
    container_name: django
    env_file:
      - .env
    volumes:
      - ./:/app
      - ./staticfiles:/app/staticfiles
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: react
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
